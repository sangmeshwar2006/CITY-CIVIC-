name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Verify Backend Integrity
        run: |
          cd backend
          npm ci || npm install
          node --check server.js

      - name: Build Admin Production Assets
        run: |
          cd admin
          npm ci || npm install
          npm run build

      - name: Package Release Archive
        run: |
          tar -czvf city-civic-release-${{ github.ref_name }}.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.log' \
            admin backend flutter_app docs docker-compose.yml Makefile README.md LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: City Civic ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            city-civic-release-${{ github.ref_name }}.tar.gz
