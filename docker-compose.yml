version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: city-civic-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: city-civic
    volumes:
      - mongo_data:/data/db
    networks:
      - city-civic-network

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM node:18-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 5000
        CMD ["npm", "run", "dev"]
    container_name: city-civic-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/city-civic
      JWT_SECRET: super-secret-jwt-token
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - city-civic-network

  admin:
    build:
      context: ./admin
      dockerfile_inline: |
        FROM node:18-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 5173
        CMD ["npm", "run", "dev", "--", "--host"]
    container_name: city-civic-admin
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./admin:/app
      - /app/node_modules
    networks:
      - city-civic-network

volumes:
  mongo_data:

networks:
  city-civic-network:
    driver: bridge
