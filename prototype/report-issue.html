  <section class="page-header">
    <h2>Report a Civic Issue</h2>
    <p>Help improve your city by reporting civic problems</p>
  </section>

 <section class="report-section">
  <form class="report-form">

 
    <div class="form-group">
      <label>State</label>
      <select id="stateSelect" required>
        <option value="">Select State</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Uttar Pradesh">Uttar Pradesh</option>
        <option value="Telangana">Telangana</option>
        <option value="Delhi">Delhi</option>
      </select>
    </div>

  
    <div class="form-group">
      <label>City</label>
      <select id="citySelect" required disabled>
        <option value="">Select City</option>
      </select>
    </div>

    <div class="form-group">
      <label>Area / Ward</label>
      <input type="text" placeholder="Enter area or ward name" required>
    </div>

    <div class="form-group">
  <label>Location</label>
  <input type="text" id="locationField" placeholder="Auto-generated location" readonly>
</div>


    <div class="form-group">
      <label>Issue Category</label>
      <select required>
        <option value="">Select Issue Type</option>
        <option>Road & Potholes</option>
        <option>Garbage & Waste</option>
        <option>Water Supply</option>
        <option>Street Light</option>
        <option>Drainage & Sanitation</option>
        <option>Traffic Issue</option>
      </select>
    </div>

    <div class="form-group">
      <label>Landmark (Optional)</label>
      <input type="text" placeholder="Near bus stop, school, etc.">
    </div>

    <div class="form-group full">
      <label>Issue Description</label>
      <textarea rows="4" placeholder="Describe the problem clearly..." required></textarea>
    </div>

    <div class="form-group full">
      <label>Upload Photo (Optional)</label>
      <input type="file">
    </div>

    <button type="submit" class="submit-btn">Submit Issue</button>

<script>
    const reportForm = document.querySelector(".report-form");

if (reportForm) {
  reportForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const city = reportForm.querySelector("select").value;
    const area = reportForm.querySelector("input[type='text']").value;
    const category = reportForm.querySelectorAll("select")[1].value;
    const description = reportForm.querySelector("textarea").value;

    if (!city || !area || !category || !description) {
      alert("Please fill all required fields");
      return;
    }

    const issue = {
      id: Date.now(),
      city,
      area,
      category,
      description,
      status: "Pending",
      date: new Date().toLocaleDateString()
    };

    let issues = JSON.parse(localStorage.getItem("issues")) || [];
    issues.push(issue);
    localStorage.setItem("issues", JSON.stringify(issues));

    alert("✅ Issue reported successfully!");
    reportForm.reset();
  });
}


const citiesByState = {
  Karnataka: ["Bengaluru", "Mysuru", "Mangaluru", "Bidar"],
  Maharashtra: ["Mumbai", "Pune", "Nagpur"],
  "Uttar Pradesh": ["Ayodhya", "Lucknow", "Varanasi"],
  Telangana: ["Hyderabad", "Warangal"],
  Delhi: ["New Delhi"]
};

const stateSelect = document.getElementById("stateSelect");
const citySelect = document.getElementById("citySelect");

stateSelect.addEventListener("change", () => {
  const state = stateSelect.value;
  citySelect.innerHTML = `<option value="">Select City</option>`;
  citySelect.disabled = !state;

  if (citiesByState[state]) {
    citiesByState[state].forEach(city => {
      const option = document.createElement("option");
      option.textContent = city;
      option.value = city;
      citySelect.appendChild(option);
    });
  }
});


conststateSelect = document.getElementById("stateSelect");
constcitySelect = document.getElementById("citySelect");
const areaInput = document.querySelector(
  'input[placeholder="Enter area or ward name"]'
);
const locationField = document.getElementById("locationField");

function updateLocation() {
  const state = stateSelect.value;
  const city = citySelect.value;
  const area = areaInput.value;

  if (state && city && area) {
    locationField.value = `${city}, ${area}, ${state}`;
  } else {
    locationField.value = "";
  }
}

stateSelect.addEventListener("change", updateLocation);
citySelect.addEventListener("change", updateLocation);
areaInput.addEventListener("input", updateLocation);


const hamburger = document.getElementById("hamburger");
const navLinks = document.querySelector(".nav-links");

hamburger.addEventListener("click", () => {
  navLinks.classList.toggle("active");
});


</script>
